<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
  {% include head.html %}
  <body class="{{ page.layout }}{% if page.url == '/' %} home{% endif %}{% if page.section %} section-{{ page.section }}{% endif %}{% if page.tags contains 'food' %} food-guide{% endif %}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include masthead.html %}
    <main class="container" id="main-content" tabindex="-1">
      {{ content }}
    </main>
    {% include footer.html %}
    {% include custom-foot.html %}
  </body>
</html>
