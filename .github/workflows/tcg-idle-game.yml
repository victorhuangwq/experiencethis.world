# Tests for TCG Idle Collector (projects/tcg-idle-game). The game logic tests
# need only Node. The browser tests run the built site in Chromium.
#
# Only what a change can affect runs: nothing for changes elsewhere in the
# site or to the game's docs, the game logic tests for changes to the game's
# code or those tests, and the browser tests for changes to anything the
# page is built from or those tests. Running it by hand runs everything.
name: TCG Idle Collector

on:
  push:
    branches: [master]
    paths:
      - 'projects/tcg-idle-game/**'
      - '!projects/tcg-idle-game/**/*.md'
      - '.github/workflows/tcg-idle-game.yml'
      - '_config.yml'
      - 'Gemfile'
      - 'Gemfile.lock'
  pull_request:
    paths:
      - 'projects/tcg-idle-game/**'
      - '!projects/tcg-idle-game/**/*.md'
      - '.github/workflows/tcg-idle-game.yml'
      - '_config.yml'
      - 'Gemfile'
      - 'Gemfile.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcg-idle-game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      logic: ${{ steps.filter.outputs.logic }}
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            logic:
              - 'projects/tcg-idle-game/js/**'
              - 'projects/tcg-idle-game/tests/*.js'
              - 'projects/tcg-idle-game/tests/fixtures/**'
              - 'projects/tcg-idle-game/package.json'
              - '.github/workflows/tcg-idle-game.yml'
            browser:
              - 'projects/tcg-idle-game/js/**'
              - 'projects/tcg-idle-game/css/**'
              - 'projects/tcg-idle-game/index.html'
              - 'projects/tcg-idle-game/tests/e2e/**'
              - 'projects/tcg-idle-game/tests/fixtures/**'
              - 'projects/tcg-idle-game/package.json'
              - 'projects/tcg-idle-game/package-lock.json'
              - '.github/workflows/tcg-idle-game.yml'
              - '_config.yml'
              - 'Gemfile'
              - 'Gemfile.lock'

  unit:
    name: Game logic tests
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.logic == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/tcg-idle-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  browser:
    name: Browser tests
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.browser == 'true') }}
    runs-on: ubuntu-latest
    env:
      # Jekyll reads the site's files in the system's encoding
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build the site
        run: bundle exec jekyll build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/tcg-idle-game/package-lock.json
      - name: Install Chromium
        working-directory: projects/tcg-idle-game
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: projects/tcg-idle-game
        run: npm run test:e2e
      - name: Keep screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots
          path: projects/tcg-idle-game/test-results
          if-no-files-found: ignore
