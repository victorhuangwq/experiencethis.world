# Dependencies
markdown:         kramdown
highlighter:      rouge

title: experience this
email: victorhuangwq@gmail.com
tagline: Writing, projects, and recommendations by Victor Huang
description: >- # this means to ignore newlines until "baseurl:"
  thoughts by victor
baseurl: '/' # the subpath of your site, e.g. /blog
url: https://www.experiencethis.world


author:
  github: victorhuangwq
  name: 'Victor Huang'
  url: https://www.linkedin.com/in/victorhuangwq/

home_post_limit: 3
home_feature_limit: 3

collections:
  projects:
    output: false

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-redirect-from
  - jekyll-seo-tag

google_analytics_4: G-6K905HB89M

# Keep archived writing and repository documentation out of the public site.
exclude:
  - _archive/
  - vendor
  - Gemfile
  - Gemfile.lock
  - docs/
  - README.md

