# Dependencies
markdown:         kramdown
highlighter:      rouge

title: experience this
email: victorhuangwq@gmail.com
tagline: blog post detailing my projects, travels and opinions
description: >- # this means to ignore newlines until "baseurl:"
  thoughts by victor
baseurl: '/' # the subpath of your site, e.g. /blog
url: http://experiencethis.world


author:
  github: victorhuangwq
  name: 'Victor Huang'
  url: https://www.linkedin.com/in/victorhuangwq/

# Home page intro. Reword these freely -- if removed, the home page falls
# back to `description` and `tagline` above. (`description` still feeds the
# SEO meta description, so it stays as-is.)
#
# Deliberately claims no job title -- it describes the site, not the resume.
# Other headlines that were on the shortlist, if this one wears thin:
#   "I work on browsers, and a lot of other things."
#   "I fixed the back button. You're welcome."
#   "I write to entertain. Results may vary."
home_headline: "Things I build, places I eat, and opinions nobody asked for."
home_tagline: "By Victor Huang, writing here since 2018."

paginate: 10

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-seo-tag

sidebar_home_link:  true

google_analytics_4: G-6K905HB89M

